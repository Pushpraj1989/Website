# Nginx for the Azaiba Gardens portal. Serves portals/azaiba-portal/dist/ over HTTPS.
# Fill in the TODO lines (domain, certificate, htpasswd file) before use.

limit_req_zone $binary_remote_addr zone=site:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=data:10m rate=3r/s;

# Known AI-training and scraping crawlers get a plain 403. This is a deterrent, not a lock:
# a scraper that lies about its user agent gets through. Real protection is the rate limits below
# and, in front of nginx, a bot-management service (for example Cloudflare Bot Fight Mode).
map $http_user_agent $blocked_crawler {
    default 0;
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Bytespider|PerplexityBot|Amazonbot|Google-Extended|Applebot-Extended|Scrapy|python-requests|python-httpx|aiohttp|Go-http-client|httpclient|curl/|Wget/) 1;
}

server {
    listen 80;
    server_name portal.example.com;                      # TODO: domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.example.com;                      # TODO: domain
    ssl_certificate     /etc/letsencrypt/live/portal.example.com/fullchain.pem;   # TODO
    ssl_certificate_key /etc/letsencrypt/live/portal.example.com/privkey.pem;     # TODO

    root /srv/azaiba-portal/dist;                        # TODO: where build.py output is deployed
    index index.html;
    autoindex off;
    server_tokens off;

    # Security headers for the public portal.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noai, noimageai" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; object-src 'none'" always;

    # Crawlers that identify themselves as AI or scraping tools
    if ($blocked_crawler) { return 403; }

    # Public pages and the flats list
    location / {
        limit_req zone=site burst=30 nodelay;
        try_files $uri $uri/ =404;
    }

    # Content JSON for the React app: tighter limit
    location ^~ /data/ {   # ^~ so the regex rule below does not catch the JSON
        limit_req zone=data burst=20 nodelay;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /media/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Never serve source, config or git metadata
    location ~ /\. { deny all; }
    location ~* \.(md|mjs|map)$ {
        return 404;   # config, notes and source are never served to visitors
    }
}
