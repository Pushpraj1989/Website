# nginx for the Azaiba Gardens site and its content manager on one Hostinger VPS.
# Replace example.com and the paths, then: nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=site:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Known AI-training and scraping crawlers: plain 403. A deterrent, not a lock. Real protection is
# rate limits plus a bot-management service in front (Cloudflare Bot Fight Mode, or Hostinger's firewall).
map $http_user_agent $blocked_crawler {
    default 0;
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Bytespider|PerplexityBot|Amazonbot|Google-Extended|Applebot-Extended|Scrapy|python-requests|python-httpx|aiohttp|Go-http-client|httpclient|curl/|Wget/) 1;
}

server {
    listen 80;
    server_name example.com www.example.com cms.example.com;
    return 301 https://$host$request_uri;
}

# The public listing portal: static files produced by portals/azaiba-portal/build.py
server {
    listen 443 ssl http2;
    server_name example.com www.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /srv/website/portals/azaiba-portal/dist;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noai, noimageai" always;

    if ($blocked_crawler) { return 403; }

    location = /robots.txt {
        alias /srv/website/cms/deploy/robots.txt;
    }

    location / {
        limit_req zone=site burst=40 nodelay;
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
    location ^~ /data/ { try_files $uri =404; }   # the React app reads its public JSON from here
    location ~* \.(md|mjs|map|yml|yaml|json)$ { return 404; }
}

# The content manager: Node on 127.0.0.1:8800, reached only through nginx
server {
    listen 443 ssl http2;
    server_name cms.example.com;
    ssl_certificate     /etc/letsencrypt/live/cms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.example.com/privkey.pem;

    client_max_body_size 210m;   # the CMS checks the real limit (200 MB for films, 10 MB for photos)
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = / { return 302 /admin/; }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8800;
        include /etc/nginx/cms-proxy-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8800;
        include /etc/nginx/cms-proxy-headers.conf;
    }
}
