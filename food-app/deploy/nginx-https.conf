# The ordering system on __DOMAIN__. Only this host name is answered here; the server's other sites are unaffected.
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:food_app_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Compression. The app and console files are compressed once at each update (update.sh writes a .gz beside each
    # one) and sent that way to every browser that accepts it: the app's code and drawing engine shrink from about
    # 11 MB to about 4 MB. Anything else that is text is compressed as it is sent.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/wasm application/manifest+json image/svg+xml font/otf font/ttf;

    # Promotion videos can be up to 60 MB.
    client_max_body_size 64m;

    # Staff use one place, the console. The website's own order board and its sign-in page lead there.
    location = /admin { return 302 /console/#/orders; }
    location = /admin/login { return 302 /console/; }

    # Admin console (static files; it calls the API on this same address).
    location = /console { return 301 /console/; }
    location /console/ {
        alias /var/www/food-app/console/;
        try_files $uri $uri/ /console/index.html;
    }

    # Customer app in the browser (present only when built with WITH_APP=1).
    location = /app { return 301 /app/; }
    location /app/ {
        alias /var/www/food-app/app/;
        try_files $uri $uri/ /app/index.html;
        # The app's files keep their names between versions, so browsers check for a newer copy each time.
        # Headers set here replace the ones above, so those are repeated.
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # The live order stream (kitchen board and dashboard): passed through as it comes, never held back in a buffer.
    location = /v1/admin/orders/stream {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Website, API, order board and uploaded media.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, not appended, so a client cannot pass its own address to the sign-in limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_food_app;
        proxy_read_timeout 120s;
    }
}

map $http_upgrade $connection_upgrade_food_app {
    default upgrade;
    ''      close;
}
